; The only map is an empty one: the game mode builds the arena at runtime.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/Arena.Arena
EditorStartupMap=/Game/Maps/Arena.Arena
GlobalDefaultGameMode=/Script/JamGame.JamGameMode

; T-077: the full-art tier lights the arena with Lumen (software tracing on mesh distance fields, no hardware ray
; tracing: the judges' GPUs may lack it). The camera's post process turns Lumen off for the lower tiers
; (AJamCameraRig::SetLight, JamNeonRules::LightFor).
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.HardwareRayTracing=False

; The neon mouse pointer (T-034, Tools/Art/make_cursor.py): drawn by Windows, so it never trails the mouse. Tip at
; the top left corner of the 32 px image.
[/Script/Engine.UserInterfaceSettings]
; T-102: without DPI awareness Windows told the game a 3440x1440 screen at 125% was 2752x1152 and stretched its picture
; over the screen: the author's blurry first launch. The HUD scales with the screen's height, so it stays the same size.
bAllowHighDPIInGameMode=True
HardwareCursors=((Default, (CursorPath="Slate/Cursors/NeonPointer",HotSpot=(X=0.031250,Y=0.031250))))

